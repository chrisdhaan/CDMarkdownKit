disabled_rules: # rule identifiers to exclude from running
  - inclusive_language
  - opening_brace # SwiftFormat puts opening braces on new lines for wrapped signatures; disable to avoid tool conflict
  - trailing_comma # SwiftFormat enforces trailing commas in multi-line collections; disable to avoid tool conflict
included: # paths to include during linting. `--path` is ignored if present.
  - Source
  - Example/Source

# configurable rules can be customized from this configuration file.
# number of lines allowed in a file
file_length: 750
# number of lines allowed in a function
function_body_length: 110
# rules related to vars/lets
identifier_name:
  excluded:
    - to
    - i  # loop counter in NSLayoutManager
    - id  # Identifiable protocol requirement
# number of characters allowed in a line
line_length:
  error: 200
  ignores_comments: true
  ignores_function_declarations: true
  warning: 149
# number of lines allowed in a type body
type_body_length: 500
