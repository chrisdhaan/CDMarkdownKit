name: "CDMarkdownKit CI"

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "Source/**"
      - "Tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "Source/**"
      - "Tests/**"

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  iOS:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: /Applications/Xcode_26.4.1.app/Contents/Developer
            destination: "OS=26.2,name=iPhone 17 Pro"
            name: "iOS 26 (Xcode 26.4.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
            destination: "OS=26.2,name=iPhone 17 Pro"
            name: "iOS 26 (Xcode 26.3)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.2.app/Contents/Developer
            destination: "OS=26.2,name=iPhone 17 Pro"
            name: "iOS 26 (Xcode 26.2)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.1.1.app/Contents/Developer
            destination: "OS=26.1,name=iPhone 17 Pro"
            name: "iOS 26 (Xcode 26.1.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.0.1.app/Contents/Developer
            destination: "OS=26.1,name=iPhone 17 Pro"
            name: "iOS 26 (Xcode 26.0.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            destination: "OS=18.6,name=iPhone 16 Pro"
            name: "iOS 18 (Xcode 16.4)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.3.app/Contents/Developer
            destination: "OS=18.5,name=iPhone 16 Pro"
            name: "iOS 18 (Xcode 16.3)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
            destination: "OS=18.5,name=iPhone 16 Pro"
            name: "iOS 18 (Xcode 16.2)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.1.app/Contents/Developer
            destination: "OS=18.5,name=iPhone 16 Pro"
            name: "iOS 18 (Xcode 16.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.0.app/Contents/Developer
            destination: "OS=18.5,name=iPhone 16 Pro"
            name: "iOS 18 (Xcode 16.0)"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode }}
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: ${{ matrix.name }} - Debug
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit iOS" -destination "${{ matrix.destination }}" -configuration Debug clean build 2>&1 | xcbeautify --renderer github-actions
      - name: ${{ matrix.name }} - Release
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit iOS" -destination "${{ matrix.destination }}" -configuration Release clean build 2>&1 | xcbeautify --renderer github-actions

  macOS:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: /Applications/Xcode_26.4.1.app/Contents/Developer
            name: "macOS 26 (Xcode 26.4.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
            name: "macOS 26 (Xcode 26.3)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.2.app/Contents/Developer
            name: "macOS 26 (Xcode 26.2)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.1.1.app/Contents/Developer
            name: "macOS 26 (Xcode 26.1.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.0.1.app/Contents/Developer
            name: "macOS 26 (Xcode 26.0.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            name: "macOS 15 (Xcode 16.4)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.3.app/Contents/Developer
            name: "macOS 15 (Xcode 16.3)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
            name: "macOS 15 (Xcode 16.2)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.1.app/Contents/Developer
            name: "macOS 15 (Xcode 16.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.0.app/Contents/Developer
            name: "macOS 15 (Xcode 16.0)"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode }}
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: ${{ matrix.name }} - Debug
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit macOS" -destination "platform=macOS" -configuration Debug clean build 2>&1 | xcbeautify --renderer github-actions
      - name: ${{ matrix.name }} - Release
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit macOS" -destination "platform=macOS" -configuration Release clean build 2>&1 | xcbeautify --renderer github-actions

  tvOS:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: /Applications/Xcode_26.4.1.app/Contents/Developer
            destination: "OS=26.4,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 26 (Xcode 26.4.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
            destination: "OS=26.2,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 26 (Xcode 26.3)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.2.app/Contents/Developer
            destination: "OS=26.2,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 26 (Xcode 26.2)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.1.1.app/Contents/Developer
            destination: "OS=26.1,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 26 (Xcode 26.1.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.0.1.app/Contents/Developer
            destination: "OS=26.1,name=Apple TV"
            name: "tvOS 26 (Xcode 26.0.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            destination: "OS=18.5,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 18 (Xcode 16.4)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.3.app/Contents/Developer
            destination: "OS=18.5,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 18 (Xcode 16.3)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
            destination: "OS=18.5,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 18 (Xcode 16.2)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.1.app/Contents/Developer
            destination: "OS=18.5,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 18 (Xcode 16.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.0.app/Contents/Developer
            destination: "OS=18.5,name=Apple TV 4K (3rd generation) (at 1080p)"
            name: "tvOS 18 (Xcode 16.0)"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode }}
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: ${{ matrix.name }} - Debug
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit tvOS" -destination "${{ matrix.destination }}" -configuration Debug clean build 2>&1 | xcbeautify --renderer github-actions
      - name: ${{ matrix.name }} - Release
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit tvOS" -destination "${{ matrix.destination }}" -configuration Release clean build 2>&1 | xcbeautify --renderer github-actions

  watchOS:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: /Applications/Xcode_26.4.1.app/Contents/Developer
            destination: "OS=26.4,name=Apple Watch Series 11 (46mm)"
            name: "watchOS 26 (Xcode 26.4.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
            destination: "OS=26.2,name=Apple Watch Series 11 (46mm)"
            name: "watchOS 26 (Xcode 26.3)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.2.app/Contents/Developer
            destination: "OS=26.2,name=Apple Watch Series 11 (46mm)"
            name: "watchOS 26 (Xcode 26.2)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.1.1.app/Contents/Developer
            destination: "OS=26.1,name=Apple Watch Series 11 (46mm)"
            name: "watchOS 26 (Xcode 26.1.1)"
          - runner: macos-26
            xcode: /Applications/Xcode_26.0.1.app/Contents/Developer
            destination: "generic/platform=watchOS Simulator"
            name: "watchOS 26 (Xcode 26.0.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            destination: "OS=11.5,name=Apple Watch Series 10 (46mm)"
            name: "watchOS 11 (Xcode 16.4)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.3.app/Contents/Developer
            destination: "OS=11.5,name=Apple Watch Series 10 (46mm)"
            name: "watchOS 11 (Xcode 16.3)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
            destination: "OS=11.5,name=Apple Watch Series 10 (46mm)"
            name: "watchOS 11 (Xcode 16.2)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.1.app/Contents/Developer
            destination: "OS=11.5,name=Apple Watch Series 10 (46mm)"
            name: "watchOS 11 (Xcode 16.1)"
          - runner: macos-15
            xcode: /Applications/Xcode_16.0.app/Contents/Developer
            destination: "OS=11.5,name=Apple Watch Series 10 (46mm)"
            name: "watchOS 11 (Xcode 16.0)"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode }}
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: ${{ matrix.name }} - Debug
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit watchOS" -destination "${{ matrix.destination }}" -configuration Debug clean build 2>&1 | xcbeautify --renderer github-actions
      - name: ${{ matrix.name }} - Release
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit watchOS" -destination "${{ matrix.destination }}" -configuration Release clean build 2>&1 | xcbeautify --renderer github-actions

  Catalyst:
    name: Test Catalyst
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Catalyst - Debug
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit iOS" -destination "platform=macOS" -configuration Debug clean build 2>&1 | xcbeautify --renderer github-actions
      - name: Catalyst - Release
        run: |
          set -o pipefail
          env NSUnbufferedIO=YES xcodebuild -project "CDMarkdownKit.xcodeproj" -scheme "CDMarkdownKit iOS" -destination "platform=macOS" -configuration Release clean build 2>&1 | xcbeautify --renderer github-actions

  CocoaPods:
    name: pod lib lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install Gems
        run: bundle install
      - name: pod lib lint
        run: bundle exec pod lib lint --allow-warnings

  SPM:
    name: Test with SPM
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: swift test
        run: set -o pipefail && swift test -c debug 2>&1 | xcbeautify --renderer github-actions

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  codeql:
    name: CodeQL
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Build
        run: |
          xcodebuild -project CDMarkdownKit.xcodeproj \
            -scheme "CDMarkdownKit iOS" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            clean build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
